# Analyse SonarQube du front (voir Jenkinsfile, étape « Analyse SonarQube »).
# L'URL du serveur et le jeton viennent de Jenkins (withSonarQubeEnv), pas d'ici.
sonar.projectKey=netplus-front
sonar.projectName=NetPlus — Front

sonar.sources=src
sonar.exclusions=src/**/*.test.js,src/**/*.test.jsx,src/test/**,src/**/*.css
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx

# Produit par `npm test -- --coverage.enabled=true` (vite.config.js → coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
